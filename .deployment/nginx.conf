# ============================================================================
# Nginx Configuration Block for Lloyds Worker Onboarding Software
# Domain: taskai.lloyds.in
# Primary URL: https://taskai.lloyds.in/workeronboarding/
# ============================================================================

# 0. Redirects: trailing slash & legacy path redirects
location = /workeronboarding {
    return 301 /workeronboarding/;
}

location = /onboarding {
    return 301 /workeronboarding/;
}

location /onboarding/ {
    return 301 /workeronboarding/;
}

# 1. Route for Node.js Express Backend API
location /workeronboarding/api/ {
    proxy_pass         http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection keep-alive;
    proxy_set_header   Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP $remote_addr;

    # Timeouts for database operations & report generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Fallback API route for existing integrations
location /onboarding/api/ {
    proxy_pass         http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection keep-alive;
    proxy_set_header   Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP $remote_addr;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 2. Static Assets Direct Alias & Caching
location /workeronboarding/assets/ {
    alias /var/www/worker-onboarding/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# 3. Route for the React Web Frontend
location /workeronboarding/ {
    alias /var/www/worker-onboarding/dist/;
    try_files $uri $uri/ /workeronboarding/index.html;
    
    # Disable caching for HTML to ensure instant updates upon redeployment
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
}
